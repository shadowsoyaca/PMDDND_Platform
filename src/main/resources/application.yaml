# Main application settings: the database connection, JPA, Flyway, the server
# bind and session cookie, and the owner account seed.
spring:
  application:
    name: dndplatform

  # DB_PASSWORD has no default. The app refuses to start without it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pmd_dnd}
    username: ${DB_USERNAME:pmd_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Must stay validate. Hibernate checks the entities against the tables and never alters them.
      ddl-auto: validate
    # Closes the persistence session when the service method ends.
    open-in-view: false

  flyway:
    # Runs the SQL files in db/migration at startup, in order, once each.
    enabled: true
    locations: classpath:db/migration

server:
  # Reads the client address and scheme from the reverse proxy's X-Forwarded-* headers.
  forward-headers-strategy: framework
  # Binds Tomcat to loopback only. Traffic arrives through the reverse proxy.
  address: 127.0.0.1
  servlet:
    session:
      # Idle timeout. The clock restarts on every request.
      timeout: 30m
      cookie:
        # Hides the session cookie from browser JavaScript.
        http-only: true
        # Sends the cookie only on requests that start from this site.
        same-site: lax
        # There is no secure: line here. Tomcat sets the Secure flag itself
        # when the request is https.

# The seed for the owner account. OwnerBootstrap creates the row from these
# values when it is missing and ignores them when it exists.
app:
  owner:
    username: ${APP_OWNER_USERNAME}
    password-hash: ${APP_OWNER_PASSWORD_HASH}
    person-name: ${APP_OWNER_PERSON_NAME}