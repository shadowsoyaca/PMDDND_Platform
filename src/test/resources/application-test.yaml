# Test settings, loaded when a test is marked @ActiveProfiles("test").
# Points at pmd_dnd_test, a second database on the same local Postgres server.
# The test database exists on dev machines and in the CI container, not on the server.

# The URL is written out on purpose rather than read from DB_URL.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pmd_dnd_test
    username: ${DB_USERNAME:pmd_app}
    password: ${DB_PASSWORD}