# GitHub Actions workflow that runs both test suites on every pull request
# aimed at main. The result shows on the pull request as a pass or a fail.

name: Pull request checks

on:
  # Runs when a pull request aimed at main is opened, and on every push to it after that.
  pull_request:
    branches: [main]

# Gives each job read-only access to the repository.
permissions:
  contents: read

jobs:

  # Runs the backend tests against a PostgreSQL container.
  backend:
    # Branch protection on main matches this name exactly.
    name: Backend tests
    runs-on: ubuntu-latest

    # A PostgreSQL 16 container started alongside the job. The POSTGRES_*
    # variables create the pmd_app role and the pmd_dnd_test database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmd_app
          POSTGRES_DB: pmd_dnd_test
          # Same value as DB_PASSWORD in the backend step below.
          POSTGRES_PASSWORD: ci-throwaway-not-a-real-password
        ports:
          - 5432:5432
        # The health check holds the job until the database accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Clones the repository at the pull request's merge result.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Installs Temurin 17 and caches the Maven dependency tree between runs.
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs the backend tests only, through the Unix wrapper script.
      # --batch-mode turns off Maven's progress animation in the log.
      - name: Run the backend tests
        run: ./mvnw --batch-mode test
        env:
          # Throwaway values. Nothing here touches the live server.
          # Same value as POSTGRES_PASSWORD in the service block above.
          DB_PASSWORD: ci-throwaway-not-a-real-password

          # Every test class overrides these three. application.yaml has no default for them.
          APP_OWNER_USERNAME: ci-owner
          # The same hash already committed in SecurityConfigTest.java.
          APP_OWNER_PASSWORD_HASH: '$2b$10$bAe1ZGhX8mLEvyx/z3Rm6OUIRul.mTB4F.J/k/QqLwu9wTK8WGite'
          APP_OWNER_PERSON_NAME: CI Owner

  # Runs the frontend build and tests. No database and no Java.
  frontend:
    # Branch protection on main matches this name exactly.
    name: Frontend tests
    runs-on: ubuntu-latest

    # Every "run:" step below happens inside frontend/. "uses:" steps ignore this.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # node-version matches the version pinned in pom.xml.
      # cache-dependency-path is written from the repository root, not from frontend/.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins.
      - name: Install the frontend dependencies
        run: npm ci

      # Runs "tsc -b && vite build", so it type-checks as well as bundles.
      - name: Build the frontend
        run: npm run build

      # Runs "vitest run": one pass, then exit with a pass or fail code.
      - name: Run the frontend tests
        run: npm test
